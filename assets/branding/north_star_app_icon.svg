<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1429"/>
      <stop offset="0.55" stop-color="#112544"/>
      <stop offset="1" stop-color="#091629"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="43%" r="58%">
      <stop offset="0" stop-color="#2E6B83" stop-opacity="0.34"/>
      <stop offset="0.58" stop-color="#1B4664" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#10213B" stop-opacity="0"/>
